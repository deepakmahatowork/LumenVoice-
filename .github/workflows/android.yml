name: Android CI & Releases

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release page with the built APK"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag (used when publishing a manual release, e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          grep -q "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || \
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> "$SDK_DIR/licenses/android-sdk-license"
          grep -q "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || \
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Generate debug.keystore if not present
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Assemble Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Debug APK not found"
            exit 1
          fi
          cp "$APK_FILE" release-assets/LumenVoice-debug.apk
          (cd release-assets && sha256sum LumenVoice-debug.apk > LumenVoice-debug.apk.sha256)
          ls -lh release-assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: LumenVoice-debug-apk
          path: release-assets/LumenVoice-debug.apk*
          if-no-files-found: error

      - name: Publish GitHub Release Page
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/LumenVoice-debug.apk release-assets/LumenVoice-debug.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              release-assets/LumenVoice-debug.apk \
              release-assets/LumenVoice-debug.apk.sha256 \
              --title "LumenVoice $TAG" \
              --notes-file RELEASE.md
          fi
